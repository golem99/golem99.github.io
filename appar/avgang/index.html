<style>

  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -12px rgba(20,23,29,.35);

  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0c10; --bg2:#10131a; --ink:#eef0f4; --mute:#8b919c; --card:#151922; --line:#262c38;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -14px rgba(0,0,0,.8);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  background-image:linear-gradient(var(--bg2) 1px,transparent 1px),linear-gradient(90deg,var(--bg2) 1px,transparent 1px);
  background-size:28px 28px;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{display:flex;gap:2px}
.logo .fl{width:17px;height:24px;font-size:15px}
.top .mid{flex:1;text-align:center;font:600 12px/1 var(--mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-size:17px}
/* flaps */
.fl{display:inline-grid;place-items:center;background:linear-gradient(var(--board2) 0 49%,var(--flapline) 49% 51%,var(--board) 51%);
  color:var(--amber);font:800 1em/1 var(--mono);border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.4);text-transform:uppercase}
.fl.sp{background:linear-gradient(var(--board2) 0 49%,var(--flapline) 49% 51%,var(--board) 51%);color:transparent}
.flaprow{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.flaprow .fl{width:1.05em;height:1.45em}
/* score strip */
.strip{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);
  border:2px solid transparent;transition:transform .25s,border-color .25s}
.chip.on{border-color:var(--c);transform:translateY(-2px)}
.dot{width:24px;height:24px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:13px;flex:none}
.chip b{display:block;font:700 15px/1 var(--mono)}
.chip small{display:block;font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* main */
main{flex:1;display:flex;flex-direction:column;min-height:0}
.grow{flex:1}
.board{background:var(--board);border-radius:18px;padding:16px 14px;color:var(--amber);box-shadow:0 18px 40px -18px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04) inset;position:relative;overflow:hidden}
.board:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 3px,rgba(255,255,255,.012) 3px 4px);pointer-events:none}
.board .lbl{font:700 10px/1 var(--mono);letter-spacing:.22em;color:#7d8597;text-transform:uppercase}
.big{font-size:30px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:16px;font-weight:750;font-size:18px;
  background:var(--ink);color:var(--bg);box-shadow:0 10px 24px -12px rgba(0,0,0,.6);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.amber{background:var(--amber);color:#1a1300}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.row{display:flex;gap:10px}
.mt{margin-top:12px}.mt2{margin-top:20px}
.muted{color:var(--mute);font-size:14px;line-height:1.45}
h2{margin:0 0 6px;font-size:13px;font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
/* setup */
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{padding:12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;border:2px solid transparent;text-align:left}
.pcard.on{border-color:var(--c)}
.pcard:not(.on){opacity:.45}
.pcard .dot{width:36px;height:36px;font-size:19px}
.pcard strong{display:block;font-size:16px}.pcard span{font-size:11px;color:var(--mute)}
.seg{display:flex;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:4px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-weight:650;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
/* wheel */
.wheelwrap{position:relative;width:min(78vw,330px,40dvh);aspect-ratio:1;margin:8px auto 0}
.wheel{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.12,.72,.08,1);filter:drop-shadow(0 16px 22px rgba(0,0,0,.35))}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--amber);filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));z-index:2}
/* pass card */
.pass{background:var(--card);border-radius:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column}
.pass .head{background:var(--c);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pass .head .k{font:700 10px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.pass .head .v{font:800 17px/1.15 var(--sans)}
.perf{height:14px;background:radial-gradient(circle at 7px 7px,var(--bg) 6px,transparent 6.5px) -7px 0/18px 14px repeat-x;margin:0 -2px}
.qtext{padding:14px 18px 6px;font-size:clamp(21px,5.6vw,27px);line-height:1.28;font-weight:680;letter-spacing:-.01em}
.reveal{margin:10px 16px 16px;border-radius:14px;min-height:76px;display:grid;place-items:center;text-align:center;padding:12px}
.reveal.hidden{border:2px dashed var(--line);color:var(--mute);font-weight:650}
.reveal.shown{background:var(--board);color:var(--amber);font:800 22px/1.25 var(--mono);animation:pop .35s}
.fact{margin:0 16px 14px;font-size:14px;line-height:1.45;color:var(--mute)}
.fact:before{content:"Visste du? ";font-weight:750;color:var(--ink)}
.judge{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px}
.judge .btn{min-height:64px;font-size:17px}
.j-ok{background:var(--ok)!important;color:#fff!important}.j-bad{background:var(--bad)!important;color:#fff!important}.j-meh{background:var(--meh)!important;color:#1a1300!important}
.tiny{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}
.tiny button{text-decoration:underline;color:var(--mute);font-size:12px}
.diff{display:inline-flex;gap:3px}.diff i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.35}.diff i.on{opacity:1}
/* options */
.opts{display:grid;gap:8px;padding:6px 14px 14px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 12px;border-radius:14px;background:var(--bg);border:2px solid var(--line);text-align:left;font-weight:650;font-size:17px;line-height:1.2;transition:transform .1s,opacity .3s}
.opt:active{transform:scale(.98)}
.opt .L{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--board);color:var(--amber);font:800 14px var(--mono)}
.opt.cut{opacity:.12;pointer-events:none}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.4}
.result{margin:0 14px 10px;text-align:center;font-weight:800;font-size:17px}
.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}
.hintbox{margin:0 14px 8px;padding:9px 12px;border-radius:12px;background:var(--board);color:var(--amber2);font-size:15px;font-weight:600;animation:pop .3s}
.ll{display:grid;grid-template-columns:.7fr 1.2fr 1fr;gap:8px}
.ll button{min-height:48px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:750;font-size:14px;border:2px solid var(--amber)}
.ll button:disabled{opacity:.3;border-color:transparent;text-decoration:line-through}
/* guess */
.ginput{width:100%;font:800 40px/1 var(--mono);text-align:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.ginput:focus{border-color:var(--amber)}
.glist{display:flex;flex-direction:column;gap:8px}
.grow2{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);animation:slide .4s both}
.grow2.win{outline:2px solid var(--amber)}
.grow2 .n{flex:1;font-weight:700}.grow2 .v{font:700 16px var(--mono)}.grow2 .d{font-size:12px;color:var(--mute);width:84px;text-align:right}
/* departures */
.dep{display:flex;flex-direction:column;gap:6px}
.drow{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;font:700 15px/1 var(--mono);color:var(--amber);padding:9px 4px;border-bottom:1px solid #232834;animation:slide .5s both}
.drow .st{font-size:11px;padding:4px 6px;border-radius:4px;background:#232834;color:#cfd5e2;letter-spacing:.08em}
.drow.first .st{background:var(--amber);color:#1a1300}
.drow .who{color:#f2f4f8}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;z-index:9;animation:pop .3s}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.sheet>div{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:80dvh;overflow:auto}
.sheet .btn{margin-top:10px}
.flaglist{font-size:13px;line-height:1.4;white-space:pre-wrap;background:var(--card);border-radius:12px;padding:10px;max-height:30dvh;overflow:auto}
.banner{text-align:center;font:800 13px var(--mono);letter-spacing:.2em;color:var(--amber);margin-top:8px}
.confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;z-index:7;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110dvh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const isLast=()=>G.round===G.rounds;

function reader(){const i=(G.turn-1+G.order.length)%G.order.length;return G.order[i]}
function targetDiff(id){
  const pl=G.pl[id],sc=G.ids.map(x=>G.pl[x].score),avg=sc.reduce((a,b)=>a+b,0)/sc.length;
  const lead=(pl.score-avg)/10; // +1 per 10 poäng över snittet
  return Math.max(1,Math.min(3,pl.skill+Math.max(-1,Math.min(1,lead*.6))));
}
function pickCategory(id){
  const cats=P(id).cats.filter(c=>(BANK[c[0]]||[]).length);
  const tot=cats.reduce((a,c)=>a+c[2],0);let r=Math.random()*tot;
  for(const c of cats){r-=c[2];if(r<=0)return c}return cats[cats.length-1];
}
function pickQuestion(id,cat){
  const fl=flagged(),t=targetDiff(id);
  const used=new Set(G.usedNow||[]);
  let pool=(BANK[cat[0]]||[]).filter(q=>!fl.has(q.id)&&!used.has(q.id));
  let fresh=pool.filter(q=>!seen[q.id]);
  if(!fresh.length){ // kategorin slut: prova andra
    for(const c of P(id).cats){const f=(BANK[c[0]]||[]).filter(q=>!fl.has(q.id)&&!seen[q.id]&&!used.has(q.id));if(f.length){fresh=f;cat=c;break}}
  }
  if(!fresh.length)fresh=pool.length?pool:BANK[cat[0]];
  fresh=fresh.map(q=>[Math.abs(q.d-t)+Math.random()*.9,q]).sort((a,b)=>a[0]-b[0]);
  return {q:fresh[0][1],cat};
}
function spin(){
  const id=currentPlayer(),cat=pickCategory(id),cats=wheelCats(id);
  const idx=cats.findIndex(c=>c[0]===cat[0]);
  const tot=cats.reduce((a,c)=>a+c[2],0);let start=0;for(let i=0;i<idx;i++)start+=cats[i][2];
  const mid=(start+cats[idx][2]/2)/tot*360;
  const jitter=(Math.random()-.5)*(cats[idx][2]/tot*360)*.6;
  const base=(G.wheelRot||0);const target=base+360*5+(360-mid-jitter)-((base)%360);
  G.wheelRot=target;G.phase="spinning";
  const w=$("#wheel");if(w){w.style.transform="rotate("+target+"deg)"}
  const btn=$("#spinbtn");if(btn){btn.disabled=true;btn.style.opacity=.5}
  let ticks=0;const iv=setInterval(()=>{sfx.tick();if(++ticks>22)clearInterval(iv)},120);
  setTimeout(()=>{
    const {q,cat:c2}=pickQuestion(id,cat);
    G.cur=makeCur(id,c2,q);
    G.usedNow=(G.usedNow||[]).concat(q.id);
    G.phase="question";save();render();
  },3300);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function autoWrong(pool,q){
  const num=/^-?[\d\s.,]+$/.test(q.a.trim());
  if(num){const n=parseNum(q.a);if(n!==null){const isYear=n>1000&&n<2100&&Number.isInteger(n);const out=new Set();let k=0;
    while(out.size<3&&k++<50){let d=isYear?(1+Math.random()*15|0):Math.max(1,Math.round(Math.abs(n)*(.1+Math.random()*.4)));if(Math.random()<.5)d=-d;const v=n+d;if(v!==n&&(v>=0||n<0))out.add(String(v))}
    if(out.size===3)return [...out]}}
  const others=[...new Set((BANK[pool]||[]).map(x=>x.a).filter(a=>a!==q.a&&/^-?[\d\s.,]+$/.test(a.trim())===num&&a.length<40))];
  let res=shuffle(others).slice(0,3);
  if(res.length<3){const all=[...new Set(Object.entries(BANK).filter(([k])=>k!=="gissa").flatMap(([k,v])=>v.map(x=>x.a)).filter(a=>a!==q.a&&!res.includes(a)&&/^-?[\d\s.,]+$/.test(a.trim())===num&&a.length<40))];res=res.concat(shuffle(all).slice(0,3-res.length))}

}
function makeCur(id,cat,q){
  let w=(q.w&&q.w.length>=3)?q.w.slice(0,3):autoWrong(cat[0],q);

}
function findQ(pool,id){return (BANK[pool]||[]).find(q=>q.id===id)}
function answer(i){

  c.pick=i;const pts=ok?10*mult():0;

function nextTurn(){

function parseNum(s){s=String(s).replace(/\s/g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?n:null}

function header(){
  $("#logo").innerHTML=[..."AVGÅNG"].map(c=>'<span class="fl">'+c+'</span>').join("");
  $("#snd").textContent=sound?"🔈":"🔇";
  if(!G||G.phase==="setup"){$("#mid").textContent="";$("#strip").innerHTML="";return}
  $("#mid").innerHTML=G.phase==="final"?"Landat":(isLast()?"Sista frågan · ×2":"Fråga "+G.round+" av "+G.rounds);
  const active=G.cur?G.cur.pid:(["turn","spinning"].includes(G.phase)?currentPlayer():null);
  $("#strip").innerHTML=G.ids.map(id=>{const p=P(id);return '<div class="chip'+(id===active?" on":"")+'" style="--c:'+p.c+'"><span class="dot">'+p.emo+'</span><div><b>'+G.pl[id].score+'</b><small>'+p.name+'</small></div></div>'}).join("");
}
function wheelCats(id){return P(id).cats.filter(c=>(BANK[c[0]]||[]).length)}
function wheelSVG(id){
  const p=P(id),cats=wheelCats(id),tot=cats.reduce((a,c)=>a+c[2],0);
  let a0=-90,out="";
  const shades=[0,.18,.34,.08,.26,.42,.12,.3,.2];
  cats.forEach((c,i)=>{
    const sweep=c[2]/tot*360,a1=a0+sweep,r=100;
    const p0=[Math.cos(a0*Math.PI/180)*r,Math.sin(a0*Math.PI/180)*r],p1=[Math.cos(a1*Math.PI/180)*r,Math.sin(a1*Math.PI/180)*r];
    const fill=c[0].includes("berlin")?"#11141a":mix(p.hex,i%2?"#ffffff":"#000000",shades[i%shades.length]);
    out+='<path d="M0 0L'+p0[0]+' '+p0[1]+'A100 100 0 '+(sweep>180?1:0)+' 1 '+p1[0]+' '+p1[1]+'Z" fill="'+fill+'" stroke="rgba(255,255,255,.55)" stroke-width="1"/>';
    const am=(a0+sweep/2)*Math.PI/180,tr=62;
    const fs=sweep<26?7:(c[1].length>11?8:9.5);
    out+='<text x="'+Math.cos(am)*tr+'" y="'+Math.sin(am)*tr+'" transform="rotate('+((a0+sweep/2+360)%360>90&&(a0+sweep/2+360)%360<270?a0+sweep/2+180:a0+sweep/2)+' '+Math.cos(am)*tr+' '+Math.sin(am)*tr+')" fill="'+(c[0].includes("berlin")?"#ffb21c":"#fff")+'" font-family="-apple-system,sans-serif" font-weight="800" font-size="'+fs+'" text-anchor="middle" dominant-baseline="middle">'+esc(c[1])+'</text>';
    a0=a1;
  });
  return '<svg viewBox="-104 -104 208 208" class="wheel" id="wheel" style="transform:rotate('+(G.wheelRot||0)+'deg)"><circle r="103" fill="#11141a"/>'+out+
   '<circle r="22" fill="#11141a" stroke="#ffb21c" stroke-width="2"/><text y="1" font-size="20" text-anchor="middle" dominant-baseline="middle">'+p.emo+'</text>'+
   Array.from({length:24},(_,i)=>{const a=i*15*Math.PI/180;return '<circle cx="'+Math.cos(a)*97+'" cy="'+Math.sin(a)*97+'" r="1.6" fill="#ffd27a"/>'}).join("")+'</svg>';
}
function mix(h,w,t){const a=parseInt(h.slice(1),16),b=parseInt(w.slice(1),16);const r=Math.round(((a>>16)&255)*(1-t)+((b>>16)&255)*t),g=Math.round(((a>>8)&255)*(1-t)+((b>>8)&255)*t),bl=Math.round((a&255)*(1-t)+(b&255)*t);return "rgb("+r+","+g+","+bl+")"}

function render(){
  header();const m=$("#main");
  if(!G||G.phase==="setup"){m.innerHTML=setupHTML();bindSetup();animateFlaps(m);return}
  const ph=G.phase;
  if(ph==="turn"||ph==="spinning"){
    const p=P(currentPlayer()),r=P(reader());
    m.innerHTML='<div class="board"><div class="lbl">Nästa avgång</div><div class="mt">'+flaps(p.name,"big")+'</div><div class="banner">FRÅGA '+((G.round-1)+1)+' AV '+G.rounds+'</div></div>'+
      '<div class="grow" style="display:flex;flex-direction:column;justify-content:center"><div class="wheelwrap"><div class="pointer"></div>'+wheelSVG(p.id)+'</div></div>'+
      '<button class="btn amber" id="spinbtn">Snurra hjulet</button><div class="tiny">Ge telefonen till '+esc(p.name)+' – eller läs upp frågan högt. Livlinor kvar: '+llCount(p.id)+' av 3</div>';
    animateFlaps(m);$("#spinbtn").onclick=spin;return;
  }
  if(ph==="lastIntro"){
    m.innerHTML='<div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:16px"><div class="board" style="text-align:center"><div class="lbl">Sista utrop</div><div class="mt">'+flaps("SISTA RUNDAN","big")+'</div><div class="banner">ALLA POÄNG RÄKNAS DUBBELT</div></div><p class="muted" style="text-align:center">Nu kan allt hända. Rätt svar ger 20 poäng, och det gör Gissa närmast i slutet också.</p></div><button class="btn amber" id="go">Kör!</button>';
    animateFlaps(m);$("#go").onclick=()=>{G.phase="turn";save();render()};sfx.chime();return;
  }
  if(ph==="question"){
    const c=G.cur,p=P(c.pid),q=findQ(c.pool,c.id),pl=G.pl[c.pid],done=c.pick!==null;
    const L="ABCD";
    m.innerHTML='<div class="pass" style="--c:'+p.c+'"><div class="head"><div><div class="k">Fråga till</div><div class="v">'+p.emo+' '+esc(p.name)+'</div></div><div style="text-align:right"><div class="k">'+esc(c.label)+'</div><div class="diff">'+[1,2,3].map(n=>'<i class="'+(q.d>=n?"on":"")+'"></i>').join("")+'</div></div></div>'+
      '<div class="perf"></div><div class="qtext">'+esc(q.q)+'</div>'+
      (c.hint&&!done?'<div class="hintbox">💡 '+esc(hintText(q))+'</div>':'')+
      (c.friend&&!done?'<div class="hintbox">📞 '+esc(P(c.pid).name)+' frågar '+esc(P(c.friend).name)+'</div>':'')+
      '<div class="opts">'+c.opts.map((o,i)=>{let cl="opt";if(c.cut.includes(i))cl+=" cut";if(done){if(o===q.a)cl+=" right";else if(i===c.pick)cl+=" wrong";else cl+=" dim"}
        return '<button class="'+cl+'" data-o="'+i+'"'+(c.cut.includes(i)||done?" disabled":"")+'><span class="L">'+L[i]+'</span><span>'+esc(o)+'</span></button>'}).join("")+'</div>'+
      (done?'<div class="result '+(c.opts[c.pick]===q.a?"ok":"bad")+'">'+esc(c.result)+'</div>'+(q.f?'<div class="fact">'+esc(q.f)+'</div>':''):'')+
      '</div><div class="grow"></div>'+
      (done?'<button class="btn amber mt" id="next">Nästa</button>':
      '<div class="ll mt">'+[["fifty","50/50"],["friend","📞 Fråga en vän"],["hint","💡 Ledtråd"]].map(([k,l])=>'<button data-ll="'+k+'" '+(pl.ll[k]?"":"disabled")+'>'+l+'</button>').join("")+'</div>')+
      '<div class="tiny">'+(isLast()?"Dubbla poäng · ":"")+'Rätt ger '+10*mult()+' poäng · <button id="flag">Flagga fel fråga</button></div>';
    m.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
    m.querySelectorAll("[data-ll]").forEach(b=>b.onclick=()=>useLL(b.dataset.ll));
    const nx=$("#next");if(nx)nx.onclick=nextTurn;
    $("#flag").onclick=()=>{if(done){flags.some(f=>f.id===q.id)||flags.push({id:q.id,pool:c.pool,q:q.q,a:q.a});store.set(FLAGS,flags);toast("Flaggad")}else flagQ(c.pool,q)};
    return;
  }
  if(ph==="guessIntro"){
    const q=findQ("gissa",G.guess.id);
    m.innerHTML='<div class="board" style="text-align:center"><div class="lbl">Alla gissar</div><div class="mt">'+flaps("GISSA NÄRMAST")+'</div></div>'+
      '<div class="pass mt" style="--c:#11141a"><div class="perf" style="margin-top:6px"></div><div class="qtext" style="text-align:center">'+esc(q.q)+'</div><p class="muted" style="text-align:center;padding:0 16px 14px;margin:0">Svaret i '+esc(q.u||"siffror")+'. Närmast får '+10*mult()+' poäng och tvåan '+5*mult()+'.</p></div>'+
      '<div class="grow"></div><button class="btn amber" id="go">Samla in gissningarna</button><div class="tiny">Läs upp frågan. Alla funderar, sedan skrivs gissningarna in en i taget.</div>';
    animateFlaps(m);$("#go").onclick=()=>{G.phase="guessInput";save();render()};return;
  }
  if(ph==="guessInput"){
    const q=findQ("gissa",G.guess.id),id=G.order[G.guess.i],p=P(id);
    m.innerHTML='<div class="pass" style="--c:'+p.c+'"><div class="head"><div><div class="k">Gissning</div><div class="v">'+p.emo+' '+esc(p.name)+'</div></div><div class="k">'+(G.guess.i+1)+' / '+G.order.length+'</div></div><div class="qtext" style="font-size:18px;padding-bottom:14px">'+esc(q.q)+'</div></div>'+
      '<div class="mt2"><input id="gin" class="ginput" inputmode="decimal" autocomplete="off" placeholder="?"><p class="muted" style="text-align:center">'+esc(q.u||"")+'</p></div><div class="grow"></div>'+
      '<button class="btn amber" id="lock">Lås '+esc(p.name)+'s gissning</button><div class="tiny">Gissningen göms direkt när den är låst.</div>';
    const i=$("#gin");setTimeout(()=>i.focus(),50);i.onkeydown=e=>{if(e.key==="Enter")lockGuess()};$("#lock").onclick=lockGuess;return;
  }
  if(ph==="guessReveal"){
    const q=findQ("gissa",G.guess.id);
    const rows=G.order.map(id=>({id,v:G.guess.vals[id],d:Math.abs(G.guess.vals[id]-q.a)})).sort((a,b)=>a.d-b.d);
    m.innerHTML='<div class="board" style="text-align:center"><div class="lbl">Rätt svar</div><div class="mt">'+flaps(fmt(q.a).replace(/ /g," "),"big")+'</div><div class="banner">'+esc((q.u||"").toUpperCase())+'</div></div>'+
      (q.f?'<p class="fact mt" style="margin:12px 2px">'+esc(q.f)+'</p>':'<div class="mt"></div>')+
      '<div class="glist">'+rows.map((r,i)=>'<div class="grow2'+(G.guess.win.includes(r.id)?" win":"")+'" style="animation-delay:'+(i*.12)+'s"><span class="dot" style="--c:'+P(r.id).c+'">'+P(r.id).emo+'</span><span class="n">'+esc(P(r.id).name)+(G.guess.win.includes(r.id)?" · +"+10*mult():(G.guess.second||[]).includes(r.id)?" · +"+5*mult():"")+'</span><span class="v">'+fmt(r.v)+'</span><span class="d">'+(r.d===0?"exakt!":"miss "+fmt(r.d))+'</span></div>').join("")+'</div>'+
      '<div class="grow"></div><button class="btn amber mt" id="go">Vidare</button>';
    animateFlaps(m);$("#go").onclick=()=>{G.guess=null;endRound()};return;
  }
  if(ph==="final"){
    const rows=G.ids.map(id=>({id,...G.pl[id]})).sort((a,b)=>b.score-a.score);
    const top=rows[0].score;
    m.innerHTML='<div class="board"><div class="lbl" style="display:flex;justify-content:space-between"><span>Ankomster</span><span>Poäng · Status</span></div><div class="dep mt">'+
      rows.map((r,i)=>'<div class="drow'+(r.score===top?" first":"")+'" style="animation-delay:'+((rows.length-1-i)*.7)+'s"><span>'+(i+1)+'</span><span class="who">'+P(r.id).emo+' '+esc(P(r.id).name.toUpperCase())+'</span><span>'+r.score+'</span><span class="st">'+(r.score===top?"VINNARE":"LANDAT")+'</span></div>').join("")+
      '</div></div><p class="muted mt" style="text-align:center">'+esc(rows.filter(r=>r.score===top).map(r=>P(r.id).name).join(" och "))+' vann! '+rows.map(r=>P(r.id).name+" "+r.right+"/"+r.asked+" rätt").join(" · ")+'</p>'+
      '<div class="grow"></div><button class="btn amber" id="again">Ny omgång, samma gäng</button><button class="btn ghost mt" id="home">Till start</button>';
    $("#again").onclick=()=>newGame(G.ids,G.rounds);$("#home").onclick=()=>{G=null;store.set(KEY,null);render()};return;
  }
}
let setupSel=null,setupRounds=10;
function setupHTML(){
  setupSel=setupSel||PLAYERS.map(p=>p.id);
  const total=Object.entries(BANK).reduce((a,[k,v])=>a+v.length,0),seenN=Object.keys(seen).length;
  return '<div class="board" style="text-align:center;padding:22px 14px"><div class="lbl">Familjens frågesport</div><div class="mt">'+flaps("AVGÅNG","big")+'</div><div class="banner">ÅBO → BERLIN · GATE 4</div></div>'+
   '<h2 class="mt2">Passagerare</h2><div class="players">'+PLAYERS.map(p=>'<button class="pcard'+(setupSel.includes(p.id)?" on":"")+'" style="--c:'+p.c+'" data-p="'+p.id+'"><span class="dot">'+p.emo+'</span><span><strong>'+p.name+'</strong><span>'+p.tag+'</span></span></button>').join("")+'</div>'+
   '<h2 class="mt2">Längd</h2><div class="seg">'+[[5,"5 frågor var"],[10,"10 var"],[20,"20 var"]].map(([n,l])=>'<button data-r="'+n+'" class="'+(setupRounds===n?"on":"")+'">'+l+'</button>').join("")+'</div>'+
   '<p class="muted mt">Hjulet väljer ämne, och alla får frågor på sin egen nivå. Var och en har tre livlinor: 50/50, Fråga en vän och Ledtråd. Var tredje runda är det Gissa närmast, och sista rundan ger dubbla poäng. 10 frågor var tar ungefär 25 minuter.</p>'+
   '<div class="grow"></div>'+(G&&G.phase&&G.phase!=="final"?'<button class="btn ghost" id="resume">Fortsätt pågående spel</button><div style="height:10px"></div>':'')+
   '<button class="btn amber" id="start">Ombordstigning</button><div class="tiny">'+total+' frågor ombord · '+seenN+' redan använda</div>';
}
function bindSetup(){
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const id=b.dataset.p;setupSel=setupSel.includes(id)?setupSel.filter(x=>x!==id):PLAYERS.map(p=>p.id).filter(x=>x===id||setupSel.includes(x));render()});
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{setupRounds=+b.dataset.r;render()});
  $("#start").onclick=()=>{if(setupSel.length<2){toast("Minst två passagerare");return}newGame(setupSel,setupRounds)};
  const r=$("#resume");if(r)r.onclick=()=>{G.phase=G.phase==="setup"?"turn":G.phase;render()};
}
function flagQ(pool,q){
  if(flags.some(f=>f.id===q.id)){toast("Redan flaggad");return}
  flags.push({id:q.id,pool,q:q.q,a:q.a});store.set(FLAGS,flags);
  toast("Flaggad – byter fråga");
  const id=G.cur.pid,cat=P(id).cats.find(c=>c[0]===pool)||pickCategory(id);
  const n=pickQuestion(id,cat);G.cur=makeCur(id,n.cat,n.q);G.usedNow.push(n.q.id);save();render();
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
function confetti(n){const cs=["#ffb21c","#22b5a6","#f2785b","#7381ff","#ff5fa8"];for(let i=0;i<n;i++){const d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=cs[i%5];d.style.animationDuration=(1.6+Math.random()*1.6)+"s";d.style.animationDelay=(Math.random()*.4)+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}}
function openMenu(){
  const s=document.createElement("div");s.className="sheet";
  s.innerHTML='<div><h2>Meny</h2>'+(G&&G.phase!=="final"?'<button class="btn ghost" id="m-end">Avsluta spelet och visa resultat</button><button class="btn ghost" id="m-quit">Avbryt spelet utan resultat</button>':'')+
   '<h2 class="mt2">Flaggade frågor ('+flags.length+')</h2>'+(flags.length?'<div class="flaglist">'+esc(flags.map(f=>"• "+f.q+" → "+f.a).join("\n"))+'</div><button class="btn ghost" id="m-copy">Kopiera listan till Claude</button>':'<p class="muted">Inga flaggade frågor.</p>')+
   '<button class="btn ghost" id="m-reset">Glöm vilka frågor vi har fått</button><button class="btn" id="m-close">Stäng</button></div>';
  document.body.appendChild(s);
  s.onclick=e=>{if(e.target===s)s.remove()};
  const on=(id,f)=>{const b=s.querySelector(id);if(b)b.onclick=f};
  on("#m-close",()=>s.remove());
  on("#m-end",()=>{G.phase="final";save();s.remove();render();sfx.win()});
  on("#m-quit",()=>{if(confirm("Avbryta spelet? Poängen försvinner.")){G=null;store.set(KEY,null);s.remove();render()}});
  on("#m-copy",()=>{const t="Flaggade frågor i Avgång:\n"+flags.map(f=>"- ["+f.pool+"] "+f.q+" → "+f.a).join("\n");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Kopierad"),()=>toast("Gick inte att kopiera"))});
  on("#m-reset",()=>{if(confirm("Alla frågor blir nya igen. Säker?")){seen={};store.set(SEEN,seen);toast("Klart");s.remove();render()}});
}
$("#snd").onclick=()=>{sound=!sound;store.set(SND,sound);header();if(sound)sfx.meh()};
$("#menu").onclick=openMenu;
if(G&&G.phase==="spinning"){G.phase="turn"}
if(G&&!G.ids)G=null;
if(G&&G.phase!=="final"&&G.phase!=="setup"){ /* visa startsida med Fortsätt */ G._resume=true }
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
