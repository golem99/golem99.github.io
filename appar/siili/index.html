<style>
:root{--ink:#3b2a22;--cream:#fff6e8;--rust:#c8643c;--moss:#6f8f4e;--sky:#bfe0ef;--card:#fffaf2;--shadow:0 10px 30px rgba(40,20,10,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1e1712;color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:12px;align-items:center}
.pill{pointer-events:auto;background:rgba(255,246,232,.92);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-weight:800;display:flex;gap:8px;align-items:center}
.pill button{all:unset;cursor:pointer;padding:2px 8px;border-radius:999px}
.pill button:hover{background:#f1e2cc}
.title{font-family:'Baloo 2';font-size:22px;letter-spacing:.5px}
#paws{font-size:18px}
.sp{flex:1}
#sub{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(900px,92vw);text-align:center;transition:opacity .25s;opacity:0}
#sub .fi{font-family:'Baloo 2';font-weight:800;font-size:clamp(22px,3vw,34px);color:#fff;text-shadow:0 2px 0 #3b2a22,0 0 18px rgba(0,0,0,.6)}
#sub .sv{font-size:clamp(15px,1.8vw,20px);color:#ffe9c9;text-shadow:0 1px 6px rgba(0,0,0,.8);margin-top:4px}
#ask{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:var(--card);border-radius:18px;padding:10px 22px;box-shadow:var(--shadow);font-weight:800;font-size:20px;opacity:0;transition:.25s}
#word{position:absolute;top:22%;left:50%;transform:translate(-50%,-50%) scale(.6);background:var(--card);border-radius:26px;padding:18px 34px;box-shadow:var(--shadow);text-align:center;opacity:0;transition:.35s cubic-bezier(.3,1.6,.5,1)}
#word.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#word .fi{font-family:'Baloo 2';font-size:58px;font-weight:800;line-height:1;color:var(--rust)}
#word .sv{font-size:22px;margin-top:6px;color:#7a6556}
#cards{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);display:flex;gap:16px;pointer-events:auto}
.card{all:unset;cursor:pointer;background:var(--card);border-radius:22px;padding:14px 18px;min-width:130px;text-align:center;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card .e{font-size:54px;line-height:1.1}
.card .t{font-family:'Baloo 2';font-weight:800;font-size:24px}
.card .s{font-size:14px;color:#8a7466}
.card.wrong{animation:shake .4s;opacity:.55}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#hint{all:unset;position:absolute;right:20px;bottom:24px;pointer-events:auto;cursor:pointer;width:64px;height:64px;border-radius:50%;background:#ffd36b;box-shadow:var(--shadow);font:800 34px 'Baloo 2';text-align:center;line-height:64px;display:none}
#menu,#start,#done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(circle at 50% 40%,rgba(255,236,205,.92),rgba(58,40,28,.92))}
.panel{background:var(--card);border-radius:30px;padding:30px 36px;box-shadow:var(--shadow);text-align:center;max-width:760px}
.panel h1{font-family:'Baloo 2';font-size:52px;margin:0;color:var(--rust);line-height:1}
.panel h2{font-family:'Baloo 2';margin:4px 0 18px;font-weight:700;color:#7a6556}
.big{all:unset;cursor:pointer;background:var(--rust);color:#fff;font:800 24px 'Baloo 2';padding:12px 34px;border-radius:999px;box-shadow:0 6px 0 #8f3f22}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #8f3f22}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 6px}
.door{all:unset;cursor:pointer;border-radius:20px;padding:14px 10px;background:#f6e6cf;text-align:center}
.door .n{font:800 26px 'Baloo 2';color:var(--rust)}
.door .d{font-size:14px;color:#6c5648}
.door.locked{opacity:.4;cursor:default}
.door.done{background:#dcebc9}
.hidden{display:none!important}
#fade{position:absolute;inset:0;background:#1e1712;opacity:0;transition:opacity .6s;pointer-events:none}

</style>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';

import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ---------- state ---------- */
const KEY='siili.v1';
const st=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}})();
st.done??=[]; st.paws??=0; st.words??={}; st.sub??=true; st.snd??=true;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let LINES={};

/* ---------- renderer and scenes ---------- */
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05; R.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(R.domElement);
const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.02,400);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const outS=new THREE.Scene(), homeS=new THREE.Scene();
let scene=outS;
const composer=new EffectComposer(R);const rp=new RenderPass(outS,cam);composer.addPass(rp);
const gtao=new GTAOPass(outS,cam,innerWidth,innerHeight);gtao.updateGtaoMaterial({radius:.18,distanceExponent:1.4,thickness:1,scale:1});gtao.blendIntensity=.85;composer.addPass(gtao);
const bokeh=new BokehPass(outS,cam,{focus:1,aperture:.0035,maxblur:.007});composer.addPass(bokeh);
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.28,.6,.88);composer.addPass(bloom);
composer.addPass(new OutputPass());
addEventListener('resize',()=>{composer.setSize(innerWidth,innerHeight)});
function useScene(s){scene=s;rp.scene=s;gtao.scene=s;bokeh.scene=s}

/* outdoor light: grey autumn afternoon */
outS.background=skyTex(); outS.fog=new THREE.Fog('#e9cdb0',18,85);
outS.add(new THREE.HemisphereLight('#bcd3e6','#7a5a3e',1.15));
const sun=new THREE.DirectionalLight('#ffcf9a',3.4); sun.position.set(52,9,30); sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096); Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:60}); sun.shadow.bias=-.0004; sun.shadow.normalBias=.02; sun.shadow.radius=4; sun.target.position.set(64.5,0,41);
const fill=new THREE.DirectionalLight('#9fc0ff',.5); fill.position.set(80,12,60); outS.add(fill);
outS.add(sun,sun.target);
/* home light */
homeS.background=new THREE.Color('#22170f');
homeS.add(new THREE.HemisphereLight('#ffdcae','#3a2416',1.1));
const hk=new THREE.DirectionalLight('#ffd9a8',1.2); hk.position.set(-0.6,1.4,-0.9); hk.castShadow=true; hk.shadow.mapSize.set(1024,1024);
Object.assign(hk.shadow.camera,{left:-1,right:1,top:1,bottom:-1}); homeS.add(hk);

/* ---------- painted textures (canvas) ---------- */
function canvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c}
function tex(c,rep=[1,1],srgb=true){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
function skyTex(){return tex(canvas(16,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#8fb4d6');gr.addColorStop(.55,'#e8d2b8');gr.addColorStop(1,'#f3c99a');g.fillStyle=gr;g.fillRect(0,0,w,h)}))}
const R01=(a,b)=>a+Math.random()*(b-a);
// stones laid in rows: returns [colorCanvas,bumpCanvas]
function stonework({w=1024,h=512,rows=5,base=[30,8,52],mortar='#6f655b',brick=false}){
  const bump=canvas(w,h,()=>{});const bg=bump.getContext('2d');bg.fillStyle='#000';bg.fillRect(0,0,w,h);
  const col=canvas(w,h,(g)=>{g.fillStyle=mortar;g.fillRect(0,0,w,h);
    for(let i=0;i<4000;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.15})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}
    const rh=h/rows;
    for(let r=0;r<rows;r++){let x=-(r%2)*R01(20,60);while(x<w){const bw=brick?w/6*R01(.9,1.1):R01(w/7,w/3.5);const pad=brick?4:R01(5,9);
      const [hh,ss,ll]=base;const L=ll+R01(-9,9),H=hh+R01(-6,6),S=ss+R01(-4,6);
      const x0=x+pad,y0=r*rh+pad,bw2=bw-pad*2,bh=rh-pad*2,rad=brick?6:R01(14,26);
      const gr=g.createLinearGradient(0,y0,0,y0+bh);gr.addColorStop(0,`hsl(${H},${S}%,${L+7}%)`);gr.addColorStop(1,`hsl(${H},${S}%,${L-7}%)`);
      g.fillStyle=gr;g.beginPath();g.roundRect(x0,y0,bw2,bh,rad);g.fill();
      // speckles and chips
      for(let k=0;k<bw2*bh/90;k++){g.fillStyle=`hsla(${H},${S}%,${L+R01(-18,18)}%,.5)`;g.fillRect(x0+Math.random()*bw2,y0+Math.random()*bh,R01(1,3),R01(1,3))}
      g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=3;g.beginPath();g.moveTo(x0+rad,y0+3);g.lineTo(x0+bw2-rad,y0+3);g.stroke();
      const bgr=bg.createRadialGradient(x0+bw2/2,y0+bh/2,2,x0+bw2/2,y0+bh/2,Math.max(bw2,bh)*.6);bgr.addColorStop(0,'#fff');bgr.addColorStop(1,'#888');bg.fillStyle=bgr;bg.beginPath();bg.roundRect(x0,y0,bw2,bh,rad);bg.fill();
      x+=bw}}
    // moss creeping at the bottom
    for(let i=0;i<900;i++){const x=Math.random()*w,y=h-Math.pow(Math.random(),2.2)*h*.35;g.fillStyle=`hsla(${R01(75,100)},${R01(35,55)}%,${R01(25,40)}%,${R01(.3,.8)})`;g.beginPath();g.arc(x,y,R01(2,7),0,7);g.fill()}
  });
  return [col,bump];
}
function cobbles(){const w=1024,h=1024;const bump=canvas(w,h,g=>{g.fillStyle='#000';g.fillRect(0,0,w,h)});const bg=bump.getContext('2d');
  const col=canvas(w,h,g=>{g.fillStyle='#5d5246';g.fillRect(0,0,w,h);
    for(let i=0;i<3000;i++){g.fillStyle=`hsla(${R01(70,95)},40%,${R01(22,34)}%,.5)`;g.fillRect(Math.random()*w,Math.random()*h,3,3)}
    const s=64;for(let y=0;y<h/s;y++)for(let x=0;x<w/s+1;x++){const ox=(y%2)*s/2,cx=x*s+ox+R01(-4,4),cy=y*s+s/2+R01(-4,4),rw=s*R01(.38,.46),rh=s*R01(.36,.44);
      const L=R01(52,70),H=R01(25,40),S=R01(8,18);const gr=g.createRadialGradient(cx-rw*.3,cy-rh*.35,2,cx,cy,rw*1.2);gr.addColorStop(0,`hsl(${H},${S}%,${L+12}%)`);gr.addColorStop(1,`hsl(${H},${S}%,${L-12}%)`);
      g.fillStyle=gr;g.beginPath();g.ellipse(cx,cy,rw,rh,R01(-.3,.3),0,7);g.fill();
      for(let k=0;k<30;k++){g.fillStyle=`rgba(0,0,0,${Math.random()*.12})`;g.fillRect(cx+R01(-rw,rw)*.8,cy+R01(-rh,rh)*.8,2,2)}
      const b=bg.createRadialGradient(cx,cy,1,cx,cy,rw);b.addColorStop(0,'#fff');b.addColorStop(1,'#333');bg.fillStyle=b;bg.beginPath();bg.ellipse(cx,cy,rw,rh,0,0,7);bg.fill()}});
  return [col,bump]}
function earthTex(){return canvas(1024,1024,(g,w,h)=>{g.fillStyle='#6b4a32';g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){g.fillStyle=`hsla(${R01(20,32)},${R01(25,45)}%,${R01(18,42)}%,${R01(.2,.6)})`;g.beginPath();g.arc(Math.random()*w,Math.random()*h,R01(1,6),0,7);g.fill()}
  for(let i=0;i<120;i++){g.fillStyle=`hsl(${R01(25,40)},${R01(5,15)}%,${R01(45,65)}%)`;g.beginPath();g.ellipse(Math.random()*w,Math.random()*h,R01(4,14),R01(3,10),R01(0,3),0,7);g.fill()}
  g.lineCap='round';for(let i=0;i<40;i++){g.strokeStyle=`hsl(30,${R01(25,40)}%,${R01(28,45)}%)`;g.lineWidth=R01(2,7);g.beginPath();let x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);for(let k=0;k<6;k++){x+=R01(-60,60);y+=R01(-20,60);g.lineTo(x,y)}g.stroke()}})}
function woodTex(){return canvas(1024,256,(g,w,h)=>{g.fillStyle='#9a6a3e';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=2){g.fillStyle=`hsla(${R01(24,32)},${R01(40,55)}%,${R01(30,50)}%,.35)`;g.fillRect(0,y+Math.sin(y*.05)*3,w,R01(1,3))}
  for(let i=0;i<6;i++){const x=R01(0,w),y=R01(0,h);g.strokeStyle='rgba(60,35,15,.5)';g.lineWidth=2;g.beginPath();g.ellipse(x,y,R01(10,24),R01(5,9),0,0,7);g.stroke()}
  for(let i=0;i<4000;i++){g.fillStyle=`rgba(40,20,5,${Math.random()*.15})`;g.fillRect(Math.random()*w,Math.random()*h,R01(2,14),1)}})}
/* ---------- simple builders for the square (from Love's TownSquare) ---------- */
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
function box(p,s,c,parent=outS){const m=new THREE.Mesh(new THREE.BoxGeometry(...s),M(c));m.position.set(...p);m.castShadow=m.receiveShadow=true;parent.add(m);return m}
function cyl(p,r,h,c,parent=outS,r2){const m=new THREE.Mesh(new THREE.CylinderGeometry(r2??r,r,h,28),M(c));m.position.set(...p);m.castShadow=m.receiveShadow=true;parent.add(m);return m}
function buildSquare(){
  const [cc,cb]=cobbles();const ct=tex(cc,[24,28]),cbt=tex(cb,[24,28],false);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(60,70),new THREE.MeshStandardMaterial({map:ct,bumpMap:cbt,bumpScale:2.2,roughness:.92}));g.rotation.x=-Math.PI/2;g.position.set(66,-.01,30);g.receiveShadow=true;outS.add(g);
  // fountain
  cyl([66,.3,27],1.3,.6,'#c9c4ba');cyl([66,.58,27],1.12,.06,'#7fc4d6');cyl([66,.95,27],.26,.8,'#bdb6aa',outS,.18);cyl([66,1.38,27],.55,.1,'#c9c4ba');
  for(const x of[63,69]){box([x,.45,31.5],[2.2,.08,.55],'#cd9866');box([x,.75,31.75],[2.2,.45,.06],'#cd9866');for(const d of[-.9,.9])box([x+d,.22,31.5],[.1,.44,.5],'#5a5560')}
  for(const[x,c]of[[61.2,'#e0557a'],[70.8,'#52b5b1']]){box([x,.5,23.2],[2,1,1],'#b98048');box([x,2.2,23.2],[2.3,.12,1.4],c);for(const d of[-.9,.9])box([x+d,1.4,23.7],[.08,1.7,.08],'#5a5560')}
  cyl([72.6,1.2,34],.22,2.4,'#8a6a4c');for(const[dx,dy,dz,r,c]of[[0,3.2,0,1.6,'#d39b4f'],[.8,2.8,.4,1.1,'#c9783f'],[-.7,3.6,-.3,1,'#e0b45a']]){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(r,3),M(c));b.position.set(72.6+dx,dy,34+dz);b.castShadow=true;outS.add(b)}
  buildSiiliCorner();
}
/* the corner by the steps, at Siili's height */
function leafGeo(){const sh=new THREE.Shape();sh.moveTo(0,0);sh.bezierCurveTo(.5,.25,.45,.8,0,1);sh.bezierCurveTo(-.45,.8,-.5,.25,0,0);const geo=new THREE.ShapeGeometry(sh,8);
  const p=geo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);p.setZ(i,x*x*.9+Math.sin(y*3)*.06)}geo.computeVertexNormals();return geo}
function buildSiiliCorner(){
  // stone plinth facing over the house base, near the hole
  const [sc,sb]=stonework({rows:4,base:[32,7,50]});
  const plinth=new THREE.Mesh(new THREE.PlaneGeometry(6.2,.8),new THREE.MeshStandardMaterial({map:tex(sc),bumpMap:tex(sb,[1,1],false),bumpScale:3,roughness:.95}));
  plinth.position.set(63.5,.4,41.728);plinth.rotation.y=Math.PI;plinth.receiveShadow=true;outS.add(plinth);
  // Juni's brick wall above the plinth
  const [bc,bb]=stonework({rows:14,base:[10,48,40],mortar:'#d6c7b2',brick:true});
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(6,2),new THREE.MeshStandardMaterial({map:tex(bc,[1,1]),bumpMap:tex(bb,[1,1],false),bumpScale:2,roughness:.9}));
  wall.position.set(63.5,1.8,41.79);wall.rotation.y=Math.PI;outS.add(wall);
  // steps get a stone texture too
  const [stc,stb]=stonework({rows:2,base:[35,5,64],mortar:'#8d867c'});
  const sm=new THREE.MeshStandardMaterial({map:tex(stc,[2,1]),bumpMap:tex(stb,[2,1],false),bumpScale:2,roughness:.9});
  box([63.5,.07,41.38],[1.5,.14,.8],'#b7b2a8').material=sm; box([63.5,.27,41.5],[1.3,.18,.55],'#b7b2a8').material=sm;
  const area=(n,fn)=>{for(let i=0;i<n;i++)fn(i)};
  // grass tufts along the wall and between cobbles
  const blade=new THREE.ConeGeometry(.006,.09,3,1,true);blade.translate(0,.045,0);
  const grassM=new THREE.MeshStandardMaterial({color:'#7b9a3c',roughness:.8,side:THREE.DoubleSide});

    play('idle');
  }
}
/* part 3: long and short sounds */
async function partLong(){
  if(scene!==homeS) await toHome();
  const P=[{a:{t:'tuli',e:'🔥',s:'eld',id:'rec1-58'},b:{t:'tuuli',e:'🌬️',s:'vind',id:'rec1-59'},h:'v-02'},
           {a:{t:'mato',e:'🪱',s:'mask',id:'rec1-60'},b:{t:'matto',e:'🟫',s:'matta',id:'rec1-61'},h:'v-03'},
           {a:{t:'kuka',e:'❓',s:'vem',id:'rec1-62'},b:{t:'kukka',e:'🌸',s:'blomma',id:'rec1-63'},h:'v-04'}];
  await say('rec1-56');await say('v-01');
  const rounds=shuffle([...P,...P]).slice(0,6);
  for(const p of rounds){const ans=Math.random()<.5?p.a:p.b;ask('Vilket ord säger Siili?');
    const replay=async()=>{await say(ans.id,{sub:false})};await replay();let tries=0;
    const hb=$('#hint');hb.style.display='block';hb.onclick=async()=>{await say(p.h)};
    for(;;){const {o,b}=await cardsChoice(shuffle([p.a,p.b]));if(o===ans){clearCards();hb.style.display='none';ask('');play('happy');showWord(ans.t,ans.s);learn(ans.t);addPaws(tries?1:3);await praise();break}
      b.classList.add('wrong');sfx('wrong',.4);tries++;play('shake');await say(rnd(OOPS));await replay()}
  }
  // Siili's mix-up
  play('happy');await say('rec1-64');ask('Sa Siili rätt?');
  for(;;){const {o,b}=await cardsChoice([{t:'Oikein',e:'👍',s:'rätt'},{t:'Väärin',e:'👎',s:'fel'}]);if(o.t==='Väärin'){clearCards();ask('');play('nod');await say('rec1-65');addPaws(3);break}b.classList.add('wrong');sfx('wrong',.4);await say('rec1-64')}
  await say('v-05');
}
/* part 4: teach Siili Swedish */
async function partTeach(){
  if(scene!==homeS) await toHome();
  const words=shuffle(Object.keys(OBJ)).slice(0,5);const home=new THREE.Vector3(0,0.02,0.1);
  for(const w of words){const pos=new THREE.Vector3();things[w].getWorldPosition(pos);
    await walkTo(pos,.15,.14);play('sniff');showWord(w,'',2200);await say('s-00');
    ask(`Vad heter ${w} på svenska?`);
    const opts=shuffle([w,...shuffle(Object.keys(OBJ).filter(x=>x!==w)).slice(0,2)]).map(k=>({t:OBJ[k].sv,e:OBJ[k].e,k}));
    let tries=0;for(;;){const {o,b}=await cardsChoice(opts);if(o.k===w){clearCards();ask('');await say(OBJ[w].s);play('happy');learn(w);addPaws(tries?1:3);break}
      b.classList.add('wrong');sfx('wrong',.4);tries++;play('shake');await say(`${o.k}-7`)}
    await walkTo(home,.16,0);face(cam.position);
  }
}
/* part 5: evening round */
async function partEvening(){
  if(scene!==homeS) await toHome();
  setMusic('evening');
  const keys=shuffle(Object.keys(OBJ)).slice(0,4);
  for(const w of keys){ask('Missä on …?');await say(`${w}-2`);const hb=$('#hint');hb.style.display='block';hb.onclick=()=>say(`${w}-4`);
    for(;;){const t=await waitPick(h=>thingOf(h)??undefined);if(t===w){hb.style.display='none';ask('');play('happy');showWord(w,OBJ[w].sv);addPaws(2);await praise();break}play('shake');await say(`${t}-7`)}}
  await say('e-01');await say('e-02');play('curl');await say('e-03');ask('Siili sover. Hyvää yötä!');await sleep(2500);
}

/* ---------- loop ---------- */
const clock=new THREE.Clock();
const _hp=new THREE.Vector3(),_pl=new THREE.Plane(),_ip=new THREE.Vector3(),_sp=new THREE.Vector3();
addEventListener('pointermove',e=>{mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1)});
R.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(mixer)mixer.update(dt);
  if(an&&!audio.paused){an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d}const rms=Math.sqrt(s/buf.length);level+=(Math.min(1,rms*7)-level)*.5}else level*=.8;
  if(jaw)jaw.rotateX(level*.42);
  if(siili&&siili.parent&&headBone){
    // look at the pointer (or the camera when the pointer is still), small and soft
    siili.getWorldPosition(_sp);ray.setFromCamera(mouse,cam);_pl.setFromNormalAndCoplanarPoint(new THREE.Vector3(0,1,0),_sp);
    if(ray.ray.intersectPlane(_pl,_ip)){const local=siili.worldToLocal(_ip.clone());const yaw=Math.atan2(local.x,local.z);const tgt=THREE.MathUtils.clamp(yaw,-.55,.55);lookYaw+=(tgt-lookYaw)*.06}
    const talk=level>.05?Math.sin(t*9)*.05*level:0;
    headBone.rotateZ(-lookYaw*.6);headBone.rotateX(Math.sin(t*.7)*.03+talk);
    if(bodyBone){bristle*=.985;const b=1+bristle*.06+Math.sin(t*2.1)*.004+Math.sin(t*.37)*.003;bodyBone.scale.multiplyScalar(1).set(bodyBone.scale.x*b,bodyBone.scale.y,bodyBone.scale.z*b)}
  }
  if(motes){const a=motes.geometry.attributes.position;for(let i=0;i<a.count;i++){a.setY(i,a.getY(i)+Math.sin(t*.6+i)*.00012);a.setX(i,a.getX(i)+Math.cos(t*.4+i*1.7)*.00008)}a.needsUpdate=true}
  if(homeMotes){homeMotes.rotation.y=Math.sin(t*.05)*.05}
  cam.lookAt(camLook);
  if(siili&&siili.parent){siili.getWorldPosition(_sp);bokeh.uniforms.focus.value=cam.position.distanceTo(_sp)}else bokeh.uniforms.focus.value=cam.position.distanceTo(camLook);
  bokeh.uniforms.aperture.value=cam.position.y>2?.0002:.0035;
  composer.render()});
