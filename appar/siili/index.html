<html lang="sv">
<head>
<meta charset="utf-8">

<title>Siili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a22;--cream:#fff6e8;--rust:#c8643c;--moss:#6f8f4e;--sky:#bfe0ef;--card:#fffaf2;--shadow:0 10px 30px rgba(40,20,10,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1e1712;color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:12px;align-items:center}
.pill{pointer-events:auto;background:rgba(255,246,232,.92);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-weight:800;display:flex;gap:8px;align-items:center}
.pill button{all:unset;cursor:pointer;padding:2px 8px;border-radius:999px}
.pill button:hover{background:#f1e2cc}
.title{font-family:'Baloo 2';font-size:22px;letter-spacing:.5px}
#paws{font-size:18px}
.sp{flex:1}
#sub{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(900px,92vw);text-align:center;transition:opacity .25s;opacity:0}
#sub .fi{font-family:'Baloo 2';font-weight:800;font-size:clamp(22px,3vw,34px);color:#fff;text-shadow:0 2px 0 #3b2a22,0 0 18px rgba(0,0,0,.6)}
#sub .sv{font-size:clamp(15px,1.8vw,20px);color:#ffe9c9;text-shadow:0 1px 6px rgba(0,0,0,.8);margin-top:4px}
#ask{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:var(--card);border-radius:18px;padding:10px 22px;box-shadow:var(--shadow);font-weight:800;font-size:20px;opacity:0;transition:.25s}
#word{position:absolute;top:22%;left:50%;transform:translate(-50%,-50%) scale(.6);background:var(--card);border-radius:26px;padding:18px 34px;box-shadow:var(--shadow);text-align:center;opacity:0;transition:.35s cubic-bezier(.3,1.6,.5,1)}
#word.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#word .fi{font-family:'Baloo 2';font-size:58px;font-weight:800;line-height:1;color:var(--rust)}
#word .sv{font-size:22px;margin-top:6px;color:#7a6556}
#cards{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);display:flex;gap:16px;pointer-events:auto}
.card{all:unset;cursor:pointer;background:var(--card);border-radius:22px;padding:14px 18px;min-width:130px;text-align:center;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card .e{font-size:54px;line-height:1.1}
.card .t{font-family:'Baloo 2';font-weight:800;font-size:24px}
.card .s{font-size:14px;color:#8a7466}
.card.wrong{animation:shake .4s;opacity:.55}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#hint{all:unset;position:absolute;right:20px;bottom:24px;pointer-events:auto;cursor:pointer;width:64px;height:64px;border-radius:50%;background:#ffd36b;box-shadow:var(--shadow);font:800 34px 'Baloo 2';text-align:center;line-height:64px;display:none}
#menu,#start,#done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(circle at 50% 40%,rgba(255,236,205,.92),rgba(58,40,28,.92))}
.panel{background:var(--card);border-radius:30px;padding:30px 36px;box-shadow:var(--shadow);text-align:center;max-width:760px}
.panel h1{font-family:'Baloo 2';font-size:52px;margin:0;color:var(--rust);line-height:1}
.panel h2{font-family:'Baloo 2';margin:4px 0 18px;font-weight:700;color:#7a6556}
.big{all:unset;cursor:pointer;background:var(--rust);color:#fff;font:800 24px 'Baloo 2';padding:12px 34px;border-radius:999px;box-shadow:0 6px 0 #8f3f22}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #8f3f22}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 6px}
.chtabs,#chtabs{display:flex;gap:8px;justify-content:center;margin:0 0 12px}.chtab{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;background:#f6e6cf;font:800 15px Nunito,sans-serif}.chtab.on{background:#c8643c;color:#fff8ec}
.door{all:unset;cursor:pointer;border-radius:20px;padding:14px 10px;background:#f6e6cf;text-align:center}
.door .n{font:800 26px 'Baloo 2';color:var(--rust)}
.door .d{font-size:14px;color:#6c5648}
.door.locked{opacity:.4;cursor:default}
.door.done{background:#dcebc9}
.hidden{display:none!important}
#fade{position:absolute;inset:0;background:#1e1712;opacity:0;transition:opacity .6s;pointer-events:none}

</style>

function canvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c}

  for(let i=0;i<46;i++){const cx=Math.random()*w,cy=R01(h*.12,h*.44),sc=R01(.5,1.4);for(let k=0;k<14;k++){const x=cx+R01(-120,120)*sc,y=cy+R01(-18,14)*sc,r=R01(26,60)*sc;
    const c=g.createRadialGradient(x,y-r*.3,0,x,y,r);const warm=cy>h*.33;c.addColorStop(0,warm?'rgba(255,236,214,.75)':'rgba(255,250,244,.7)');c.addColorStop(.6,warm?'rgba(244,206,176,.35)':'rgba(236,236,246,.3)');c.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=c;g.fillRect(x-r,y-r,2*r,2*r)}}}));
  t.wrapS=THREE.RepeatWrapping;t.repeat.set(1,1);t.mapping=THREE.EquirectangularReflectionMapping;return t}
// stones laid in rows: returns [colorCanvas,bumpCanvas]
function stonework({w=1024,h=512,rows=5,base=[30,8,52],mortar='#6f655b',brick=false}){
  const bump=canvas(w,h,()=>{});const bg=bump.getContext('2d');bg.fillStyle='#000';bg.fillRect(0,0,w,h);
  const col=canvas(w,h,(g)=>{g.fillStyle=mortar;g.fillRect(0,0,w,h);
    for(let i=0;i<4000;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.15})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}
    const rh=h/rows;
    for(let r=0;r<rows;r++){let x=-(r%2)*R01(20,60);while(x<w){const bw=brick?w/6*R01(.9,1.1):R01(w/7,w/3.5);const pad=brick?4:R01(5,9);
      const [hh,ss,ll]=base;const L=ll+R01(-9,9),H=hh+R01(-6,6),S=ss+R01(-4,6);
      const x0=x+pad,y0=r*rh+pad+R01(-3,3),bw2=bw-pad*2,bh=rh-pad*2+R01(-4,2),rad=brick?5:R01(5,12);
      const gr=g.createLinearGradient(0,y0,0,y0+bh);gr.addColorStop(0,`hsl(${H},${S}%,${L+7}%)`);gr.addColorStop(1,`hsl(${H},${S}%,${L-7}%)`);
      g.fillStyle=gr;g.beginPath();g.roundRect(x0,y0,bw2,bh,rad);g.fill();

      for(let k=0;k<bw2*bh/90;k++){g.fillStyle=`hsla(${H},${S}%,${L+R01(-18,18)}%,.5)`;g.fillRect(x0+Math.random()*bw2,y0+Math.random()*bh,R01(1,3),R01(1,3))}
      g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=3;g.beginPath();g.moveTo(x0+rad,y0+3);g.lineTo(x0+bw2-rad,y0+3);g.stroke();
      const bgr=bg.createRadialGradient(x0+bw2/2,y0+bh/2,2,x0+bw2/2,y0+bh/2,Math.max(bw2,bh)*.6);bgr.addColorStop(0,'#fff');bgr.addColorStop(1,'#888');bg.fillStyle=bgr;bg.beginPath();bg.roundRect(x0,y0,bw2,bh,rad);bg.fill();
      x+=bw}}

    for(let i=0;i<60;i++){const x=Math.random()*w,y=h-Math.pow(Math.random(),1.6)*h*.4,r=R01(20,70);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`hsla(${R01(70,95)},40%,${R01(26,36)}%,.55)`);gr.addColorStop(1,'hsla(80,40%,30%,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}

  });

}
function cobbles(){const w=1024,h=1024;const bump=canvas(w,h,g=>{g.fillStyle='#000';g.fillRect(0,0,w,h)});const bg=bump.getContext('2d');

    for(let i=0;i<5000;i++){g.fillStyle=`hsla(${R01(25,45)},${R01(10,25)}%,${R01(25,45)}%,.35)`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}
    const s=44;for(let y=-1;y<h/s+1;y++)for(let x=-1;x<w/s+1;x++){const cx=x*s+(y%2)*s/2+R01(-6,6),cy=y*s+s/2+R01(-6,6);const n=7,rr=s*.44;

      g.fillStyle=gr;g.beginPath();pts.forEach(([px,py],k)=>{const [qx,qy]=pts[(k+1)%n];const mx=(px+qx)/2,my=(py+qy)/2;k?g.quadraticCurveTo(px,py,mx,my):g.moveTo(mx,my)});g.closePath();g.fill();
      for(let k=0;k<40;k++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},0,${Math.random()*.05})`;g.fillRect(cx+R01(-rr,rr)*.7,cy+R01(-rr,rr)*.7,2,2)}
      const bgr=bg.createRadialGradient(cx,cy,1,cx,cy,rr);bgr.addColorStop(0,'#eee');bgr.addColorStop(1,'#444');bg.fillStyle=bgr;bg.beginPath();pts.forEach(([px,py],k)=>k?bg.lineTo(px,py):bg.moveTo(px,py));bg.closePath();bg.fill()}

  return [col,bump]}
function earthTex(){return canvas(1024,1024,(g,w,h)=>{g.fillStyle='#6b4a32';g.fillRect(0,0,w,h);

function makeWorm(){

    const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,255,255,.25)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(90,30,30,.25)');g.fillStyle=gr;g.fillRect(0,0,w,h)}),[1,1]);

  for(let i=0;i<=N;i++)for(let j=0;j<=RAD;j++){const k=i*(RAD+1)+j;uv[k*2]=i/N;uv[k*2+1]=j/RAD;if(i<N&&j<RAD){const a=k,b=k+RAD+1;idx.push(a,b,a+1,b,b+1,a+1)}}

  const head=new THREE.Group();const hs=new THREE.Mesh(new THREE.SphereGeometry(R0*1.35,24,18),mat);hs.castShadow=true;head.add(hs);

    const hl=new THREE.Mesh(new THREE.SphereGeometry(R0*.1,8,6),shine);hl.position.set(R0*.62,R0*.14,R0*.1*s);e.add(ew,ep,hl);e.position.set(R0*.6,R0*1.15,s*R0*.55);head.add(e)}

  smile.rotation.set(0,Math.PI/2,Math.PI*.6);smile.position.set(R0*1.28,R0*.1,0);head.add(smile);
  G.add(head);

      const r=radius(u);for(let j=0;j<=RAD;j++){const a=j/RAD*Math.PI*2;const k=(i*(RAD+1)+j)*3;

    try{if(bokeh.uniforms&&bokeh.uniforms.nearClip)bokeh.uniforms.nearClip.value=nn}catch(e){}try{for(const m of[gtao.gtaoMaterial,gtao.pdMaterial])if(m&&m.uniforms.cameraNear)m.uniforms.cameraNear.value=nn}catch(e){}}}
  if(scene===outS){const hs=Math.ceil(THREE.MathUtils.clamp(cam.position.y*1.6+2.5,3,28)/2.5)*2.5;const sc_=sun.shadow.camera;if(Math.abs(sc_.right-hs)>.05){sc_.left=-hs;sc_.right=hs;sc_.top=hs;sc_.bottom=-hs;sc_.updateProjectionMatrix()}
    const f=new THREE.Vector3().lerpVectors(camLook,cam.position,.3);const tx=2*hs/4096;f.x=Math.round(f.x/tx)*tx;f.y=Math.round(f.y/tx)*tx;f.z=Math.round(f.z/tx)*tx;sun.target.position.copy(f);sun.position.copy(f).add(SUNOFF);sun.target.updateMatrixWorld()}
  const drift=new THREE.Vector3(Math.sin(t*.31)*.6+Math.sin(t*.73)*.3,Math.sin(t*.27)*.4+Math.sin(t*.9)*.2,Math.cos(t*.23)*.5).multiplyScalar(.004*Math.max(.25,Math.min(3,cam.position.y)));
  faceStep(dt,t);doorStep(dt);homeCamStep(dt);cam.lookAt(_ip.copy(camLook).add(drift));paint.uniforms.time.value=t;
  if(siili&&siili.parent){siili.getWorldPosition(_sp);bokeh.uniforms.focus.value=cam.position.distanceTo(_sp)}else bokeh.uniforms.focus.value=cam.position.distanceTo(camLook);
  bokeh.uniforms.aperture.value=cam.position.y>2?.0002:.0035;
  composer.render()});

/* ---------- buttons ---------- */
$('#bSub').onclick=()=>{st.sub=!st.sub;save();$('#bSub').textContent='Text: '+(st.sub?'på':'av')};
$('#bSnd').onclick=()=>{st.snd=!st.snd;save();$('#bSnd').textContent=st.snd?'🔊':'🔇';if(!st.snd){audio.pause();music.pause()}else{music.play().catch(()=>{})}};
$('#bMenu').onclick=()=>{if(running)return;renderMenu();$('#menu').classList.remove('hidden')};
$('#close').onclick=()=>$('#menu').classList.add('hidden');
$('#bSub').textContent='Text: '+(st.sub?'på':'av');$('#bSnd').textContent=st.snd?'🔊':'🔇';$('#paws').textContent='🐾 '+st.paws;
cam.position.set(80,16,6);
const ready=init().then(()=>{setQuality(qStep);try{buildHarbor();for(const S_ of[homeS,outS,harbS]){R.compile(S_,cam);S_.traverse(o=>{if(o.material)for(const m of[].concat(o.material))for(const k in m){const v=m[k];if(v&&v.isTexture)R.initTexture(v)}})}}catch(e){console.warn(e)}perfHold(4000)}).catch(e=>{$('#loading').textContent='Kunde inte ladda: '+e.message;throw e});
async function introOnly(){setMusic('theme',false);useScene(outS);outS.remove(siili);await flyIn();
  document.querySelectorAll('#ui > div[style*="22%"]').forEach(e=>e.remove());
  cam.position.set(64.95,.3,40.75);camLook.set(64.6,.08,41.73);afterTheme();sfx('rustle',.6);await sleep(1200);
  putSiiliOut();siili.position.set(HOLE.x,0,HOLE.z+.2);siili.rotation.y=Math.PI;play('sniff');
  await walkLeg(new THREE.Vector3(HOLE.x,0,HOLE.z-.02),.06);play('sniff');await sleep(900);
  play('walk',.2);await walkLeg(new THREE.Vector3(HOLE.x,0,HOLE.z-.4),.1);play('idle',.25);face(cam.position);await sleep(700);play('wave');await sleep(2500);play('happy');await sleep(2000);play('idle',.3);
  const b=document.createElement('button');b.textContent='Spela ›';b.className='big';Object.assign(b.style,{position:'absolute',left:'50%',bottom:'40px',transform:'translateX(-50%)',pointerEvents:'auto'});b.style.zIndex=50;b.onclick=()=>{location.href=location.pathname};$('#ui').append(b)}
$('#go').onclick=async()=>{st.snd=true;save();$('#bSnd').textContent='🔊';const qs_=new URLSearchParams(location.search);if(qs_.has('film')){$('#start').classList.add('hidden');await ready;window.__noAuto=true;setQuality(0);document.querySelectorAll('#ui,#menu,#loading').forEach(e=>e.style.display='none');useScene(outS);outS.remove(siili);await sleep(1500);await flyLive();return}if(!st.done.includes(0)||qs_.has('intro')){setMusic('theme',false);startFilm()}await ready;initAudio();$('#start').classList.add('hidden');if(new URLSearchParams(location.search).has('intro')){introOnly();return}if(!st.done.includes(0))runPart(0);else{renderMenu();$('#menu').classList.remove('hidden')}};
